# Det, funktionen får at vide om kurven. Kun tags — ingen persondata.
query CartInput {
  cart {
    buyerIdentity {
      customer {
        hasTags(tags: ["erhverv-niveau-1", "erhverv-niveau-2", "erhverv-niveau-3"]) {
          tag
          hasTag
        }
      }
    }
    lines {
      id
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            isGiftCard
          }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app:erhverv", key: "config") {
      jsonValue
    }
  }
}
